services:
  api1:
    build: .
    env_file: .env
    environment:
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - chroma_data:/app/chroma_store
    restart: unless-stopped

  api2:
    build: .
    env_file: .env
    environment:
      TRUST_PROXY_HEADERS: "true"
    volumes:
      - ./serviceAccountKey.json:/app/serviceAccountKey.json:ro
      - chroma_data:/app/chroma_store
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api1
      - api2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  chroma_data:
