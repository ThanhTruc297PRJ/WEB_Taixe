events {}

http {
    log_format api '$remote_addr - $request_id [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time';

    access_log /var/log/nginx/access.log api;

    # Gateway-level protection in addition to FastAPI rate limiting.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    upstream driver_backend {
        least_conn;
        server api1:8000;
        server api2:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 10m;
        location /ws/ {
            proxy_pass http://api1:8000;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
}

        location / {
            limit_req zone=api_limit burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://driver_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Ready for B06 WebSocket upgrade later.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }
    }
}
